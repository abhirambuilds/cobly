# nginx configuration for the Cobly single-page application (SPA).
#
# The React app uses client-side routing (react-router). When a user opens a
# deep link directly (e.g. /login, /register, /dashboard,
# /dashboard/workspaces/:workspaceId, or
# /dashboard/workspaces/:workspaceId/projects/:projectId), nginx must serve
# index.html instead of returning 404, so the router can render the route.

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Gzip text assets for faster loads.
    gzip              on;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;

    # Long-cache the fingerprinted build assets (Vite emits hashed filenames).
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # SPA fallback: try the exact file, then a directory, then index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Do not cache the HTML entrypoint, so new deploys are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
